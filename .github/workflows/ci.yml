name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Build del proyecto
        run: npm run build

      - name: Construir imagen Docker
        run: docker build -t app-new:test .

      - name: Ejecutar contenedor Docker
        run: |
          trap 'docker rm -f app-new-test || true' EXIT
          docker run -d --name app-new-test -p 3000:3000 app-new:test
          sleep 5
          curl --fail http://localhost:3000
